<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro - AdotaPet</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Principal">
        <a class="brand" href="index.html">
          <img src="assets/adotapet-mark.svg" alt="">
          <span>AdotaPet</span>
        </a>
        <div class="nav-links">
          <a href="index.html">Inicio</a>
          <a href="recomendados.html">Recomendados</a>
          <a href="admin.html">Admin</a>
        </div>
      </nav>
    </header>

    <main class="page">
      <div class="page-title">
        <p class="overline">Perfil do adotante</p>
        <h1>Cadastro</h1>
        <p class="lead">Os dados abaixo alimentam o calculo de compatibilidade com os animais disponiveis.</p>
      </div>

      <section class="panel" aria-labelledby="cadastro-title">
        <h2 id="cadastro-title">Dados pessoais e perfil</h2>
        <form id="cadastro-form" class="form-grid">
          <div class="field">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" autocomplete="name" required maxlength="100">
          </div>
          <div class="field">
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" required maxlength="14" placeholder="000.000.000-00">
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="150">
          </div>
          <div class="field">
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" autocomplete="tel" required maxlength="20">
          </div>
          <div class="field field-full">
            <label for="endereco">Endereco</label>
            <input id="endereco" name="endereco" autocomplete="street-address" required maxlength="255">
          </div>
          <div class="field">
            <label for="tipoMoradia">Tipo de moradia</label>
            <select id="tipoMoradia" name="tipoMoradia" required>
              <option value="apartamento">Apartamento</option>
              <option value="casa_sem_quintal">Casa sem quintal</option>
              <option value="casa_com_quintal">Casa com quintal</option>
            </select>
          </div>
          <div class="field">
            <label for="nivelAtividade">Nivel de atividade</label>
            <select id="nivelAtividade" name="nivelAtividade" required>
              <option value="sedentario">Sedentario</option>
              <option value="moderado">Moderado</option>
              <option value="ativo">Ativo</option>
            </select>
          </div>
          <div class="field">
            <label for="preferenciaPorte">Porte preferido</label>
            <select id="preferenciaPorte" name="preferenciaPorte" required>
              <option value="indiferente">Indiferente</option>
              <option value="pequeno">Pequeno</option>
              <option value="medio">Medio</option>
              <option value="grande">Grande</option>
            </select>
          </div>
          <div class="field">
            <label for="preferenciaEspecie">Especie preferida</label>
            <select id="preferenciaEspecie" name="preferenciaEspecie" required>
              <option value="indiferente">Indiferente</option>
              <option value="cao">Cao</option>
              <option value="gato">Gato</option>
              <option value="outro">Outro</option>
            </select>
          </div>
          <label class="checkbox-row">
            <input name="temCriancas" type="checkbox">
            <span>Tenho criancas em casa</span>
          </label>
          <label class="checkbox-row">
            <input name="temOutrosAnimais" type="checkbox">
            <span>Tenho outros animais</span>
          </label>
          <div class="field-full form-actions">
            <button class="button" type="submit">Salvar e ver recomendados</button>
            <p id="cadastro-feedback" class="feedback" role="status"></p>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="js/pages/cadastro.js"></script>
  </body>
</html>
