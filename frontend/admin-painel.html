<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Central de modera&ccedil;&atilde;o - AdotaPet</title>
    <link rel="icon" type="image/svg+xml" href="assets/adotapet-mark.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="admin-shell-page">
    <div data-shared-auth-shell></div>

    <div class="admin-shell" data-admin-shell>
      <aside class="admin-sidebar" aria-label="Navega&ccedil;&atilde;o administrativa">
        <nav class="admin-sidebar-nav">
          <a href="#visao-geral" data-admin-nav-action="overview"><i class="fa-solid fa-house admin-nav-icon library-icon" aria-hidden="true"></i>Vis&atilde;o geral</a>
          <a href="#solicitacoes" data-admin-nav-action="animals"><i class="fa-solid fa-paw admin-nav-icon library-icon" aria-hidden="true"></i>Animais</a>
          <a href="#solicitacoes" data-admin-nav-action="pending"><i class="fa-solid fa-file-lines admin-nav-icon library-icon" aria-hidden="true"></i>Solicita&ccedil;&otilde;es<i class="fa-solid fa-chevron-down admin-nav-caret library-icon" aria-hidden="true"></i></a>
          <a class="admin-sidebar-active" href="#moderacao" data-admin-nav-action="moderation"><i class="fa-solid fa-shield-halved admin-nav-icon library-icon" aria-hidden="true"></i>Central de modera&ccedil;&atilde;o</a>
          <a href="#solicitacoes" data-admin-nav-action="all"><i class="fa-solid fa-list-check admin-nav-icon library-icon" aria-hidden="true"></i>Todas as solicita&ccedil;&otilde;es</a>
          <a href="#moderacao" data-admin-nav-action="interviews"><i class="fa-solid fa-envelope admin-nav-icon library-icon" aria-hidden="true"></i>Entrevistas</a>
          <a href="#moderacao" data-admin-nav-action="messages"><i class="fa-solid fa-comment-dots admin-nav-icon library-icon" aria-hidden="true"></i>Mensagens</a>
          <a href="#moderacao" data-admin-nav-action="users"><i class="fa-solid fa-users admin-nav-icon library-icon" aria-hidden="true"></i>Usu&aacute;rios</a>
          <a href="#visao-geral" data-admin-nav-action="reports"><i class="fa-solid fa-chart-line admin-nav-icon library-icon" aria-hidden="true"></i>Relat&oacute;rios</a>
          <a href="#moderacao" data-admin-nav-action="settings"><i class="fa-solid fa-gear admin-nav-icon library-icon" aria-hidden="true"></i>Configura&ccedil;&otilde;es</a>
          <a href="#moderacao" data-admin-nav-action="help"><i class="fa-solid fa-circle-question admin-nav-icon library-icon" aria-hidden="true"></i>Central de ajuda</a>
        </nav>
        <section class="admin-day-summary" id="visao-geral" aria-label="Resumo do dia" data-admin-day-summary></section>
      </aside>

      <section class="admin-shell-main">
        <header class="admin-topbar" aria-label="Filtros administrativos">
          <label class="admin-search">
            <span class="sr-only">Buscar animal ou adotante</span>
            <i class="fa-solid fa-magnifying-glass admin-search-icon library-icon" aria-hidden="true"></i>
            <input data-admin-search type="search" placeholder="Buscar animal ou adotante" autocomplete="off">
          </label>
        </header>

        <main class="moderation-page" id="moderacao">
          <div class="moderation-heading">
            <h1>Central de modera&ccedil;&atilde;o</h1>
            <p class="feedback" role="status" data-moderation-feedback></p>
          </div>

          <div class="moderation-tabs" data-status-tabs></div>

          <section class="moderation-grid" aria-label="Solicita&ccedil;&otilde;es de ado&ccedil;&atilde;o">
            <aside class="moderation-panel moderation-queue-panel" id="solicitacoes">
              <div class="moderation-panel-header">
                <div class="moderation-title-row">
                  <h2>Fila de solicita&ccedil;&otilde;es</h2>
                  <i class="fa-solid fa-filter moderation-filter-icon library-icon" aria-hidden="true"></i>
                </div>
                <label class="moderation-order">
                  <span>Ordenar por:</span>
                  <select data-admin-order>
                    <option value="mais_antigas">Mais antigas</option>
                    <option value="mais_recentes">Mais recentes</option>
                  </select>
                </label>
              </div>
              <div class="moderation-queue" data-moderation-queue></div>
            </aside>

            <section class="moderation-panel moderation-detail" data-moderation-detail aria-live="polite"></section>

            <aside class="moderation-panel moderation-decision" data-moderation-decision></aside>
          </section>
        </main>
      </section>
    </div>

    <script type="module" src="js/pages/admin-painel.js"></script>
  </body>
</html>
